<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>语言星球 · 多语言学习</title>
<style>
:root{
  --green:#58cc02; --green-d:#46a302; --blue:#1cb0f6; --blue-d:#1899d6;
  --red:#ff4b4b; --red-d:#ea2b2b; --orange:#ff9600; --purple:#ce82ff;
  --bg:#ffffff; --card:#ffffff; --soft:#f7f7f7; --text:#3c3c3c; --muted:#afafaf;
  --line:#e5e5e5; --gold:#ffc800; --shadow:0 2px 0 rgba(0,0,0,.08);
}
body.dark{ --bg:#131f23; --card:#202f36; --soft:#2b3d45; --text:#e8f1f2; --muted:#8aa1a8; --line:#334750; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.5;overscroll-behavior-y:none}
#shell{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);
  display:flex;flex-direction:column;position:relative;border-left:1px solid var(--line);border-right:1px solid var(--line)}
#app{flex:1;overflow-y:auto;padding:14px 14px 150px}
.hidden{display:none!important}

/* 顶栏 */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg);z-index:20}
.topbar .title{font-weight:800;font-size:17px;flex:1;text-align:center}
.iconbtn{width:38px;height:38px;border-radius:12px;border:none;background:var(--soft);color:var(--text);
  font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:active{transform:translateY(1px)}
.backbtn{font-size:20px}

/* 通用卡片 */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.h1{font-size:22px;font-weight:800;margin:6px 0}
.h2{font-size:18px;font-weight:800;margin:0 0 4px}

/* 按钮 */
.btn{border:none;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:800;cursor:pointer;
  width:100%;background:var(--soft);color:var(--text);box-shadow:var(--shadow);font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.primary:active{box-shadow:0 2px 0 var(--green-d)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn.disabled,.btn:disabled{background:var(--soft);color:var(--muted);box-shadow:none;cursor:default}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:14px;width:auto}
.btnrow{display:flex;gap:10px}

/* 列表项 */
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.item:active{transform:translateY(2px);box-shadow:none;background:var(--soft)}
.item .flag{font-size:30px;line-height:1}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:800;font-size:16px}
.item.locked{opacity:.55}
.item.done{background:rgba(88,204,2,.10);border-color:var(--green)}
.badge{font-size:12px;font-weight:800;color:var(--green);border:2px solid var(--green);border-radius:999px;padding:2px 8px}

/* 进度条 */
.bar{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.bar.blue > i{background:var(--blue)}
.bar.gold > i{background:var(--gold)}

/* 课程头部 */
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hero .flag{font-size:42px}
.stat{display:flex;align-items:center;gap:6px;font-weight:800}
.stat .dot{width:10px;height:10px;border-radius:50%}

/* 题目区 */
.qwrap{padding:8px 0 0}
.qprompt{font-size:20px;font-weight:800;margin:16px 0 6px;line-height:1.45}
.qprompt.small{font-size:17px}
.speaker{width:96px;height:96px;margin:18px auto;border-radius:50%;background:var(--blue);color:#fff;
  border:none;box-shadow:0 6px 0 var(--blue-d);font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.speaker:active{transform:translateY(3px);box-shadow:0 3px 0 var(--blue-d)}
.speaker.mini{width:52px;height:52px;font-size:22px;margin:0;box-shadow:0 4px 0 var(--blue-d)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);min-height:56px;text-align:left;font-family:inherit;font-size:16px;color:var(--text)}
.opt .key{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);color:var(--muted);
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.10)}
.opt.sel .key{border-color:var(--blue);color:var(--blue)}
.opt.ok{border-color:var(--green);background:rgba(88,204,2,.12)}
.opt.ok .key{border-color:var(--green);color:var(--green)}
.opt.bad{border-color:var(--red);background:rgba(255,75,75,.10)}
.opt.bad .key{border-color:var(--red);color:var(--red)}
.opt:disabled{cursor:default}
.opt .txt{flex:1;word-break:break-word}
.opt .txt.chbig{font-size:24px;font-weight:800;letter-spacing:1px}
.opt .sm{font-size:15px}
input.typed,textarea.typed{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:17px;
  font-family:inherit;background:var(--card);color:var(--text);resize:none}
input.typed:focus,textarea.typed:focus{outline:none;border-color:var(--blue)}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;padding:6px}

/* 底部动作条 */
.footbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);
  border-top:2px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:30}
.footbar.ok{background:rgba(88,204,2,.16);border-top-color:var(--green)}
.footbar.no{background:rgba(255,75,75,.14);border-top-color:var(--red)}
.footmsg{font-weight:800;margin-bottom:2px}
.footmsg.ok{color:var(--green)} .footmsg.no{color:var(--red)}
.footsub{font-size:14px;color:var(--muted);margin-bottom:10px;word-break:break-word;line-height:1.45;max-height:4.4em;overflow:auto}

/* 底部导航 */
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;display:flex;background:var(--bg);
  border-top:2px solid var(--line);z-index:25;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;border:none;background:none;padding:8px 2px 10px;color:var(--muted);font-size:11px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:inherit}
.tab .ic{font-size:21px;line-height:1}
.tab.on{color:var(--green)}

/* 字母卡 */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.acell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;
  cursor:pointer;box-shadow:var(--shadow)}
.acell:active{transform:translateY(2px);box-shadow:none;background:var(--soft)}
.acell .ch{font-size:26px;font-weight:800;line-height:1.2}
.acell .ro{font-size:12px;color:var(--muted)}
.acell .dz{font-size:10px;color:var(--muted);opacity:.85;margin-top:2px;line-height:1.25;word-break:break-word}
.alpha.mini .acell .dz{display:none}

/* 网格选择 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--card);cursor:pointer;
  font-weight:800;font-size:14px;text-align:center;font-family:inherit;color:var(--text);box-shadow:var(--shadow)}
.chip.on{border-color:var(--green);background:rgba(88,204,2,.12);color:var(--green)}
.chip:active{transform:translateY(2px)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:none}
.big{font-size:26px;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:rgba(0,0,0,.85);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:80%;text-align:center}
.ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) var(--p,0%),var(--soft) 0);
  display:flex;align-items:center;justify-content:center;flex:none}
.ring > i{width:48px;height:48px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;font-style:normal}
.heart{color:var(--red);font-size:20px}
.heart.off{color:var(--line)}

/* ===== 发音动画：口腔剖面 ===== */
.artbox{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 6px 4px;margin-top:10px}
.artbox svg{width:100%;height:auto;display:block;max-height:260px}
.artbox .head{fill:#f3d3c2;stroke:#c99b86;stroke-width:2}
.dark .artbox .head{fill:#3a4a52;stroke:#5d7580}
.artbox .cav{fill:#40292c}
.dark .artbox .cav{fill:#101a1e}
.artbox .ncav{fill:none;stroke:#40292c;stroke-width:11;stroke-linecap:round}
.dark .artbox .ncav{stroke:#101a1e}
.artbox .tooth{fill:#fff}
.dark .artbox .tooth{fill:#e8f1f2}
.artbox .tongue{fill:#e8748a;stroke:#c25a70;stroke-width:1.5}
.artbox .velum{fill:#e08a8a;stroke:#c25a70;stroke-width:1.5}
.artbox .lip{fill:none;stroke:#d1445c;stroke-width:5;stroke-linecap:round}
.artbox .air{fill:none;stroke:#1cb0f6;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:7 7;opacity:0}
.artbox .air.on{opacity:1;animation:flowdash .7s linear infinite}
.artbox .airN{fill:none;stroke:#ce82ff;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:7 7;opacity:0}
.artbox .airN.on{opacity:1;animation:flowdash .9s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-28}}
.artbox .cst{opacity:0;transition:opacity .2s}
.artbox .cst.on{opacity:1}
.artbox .cst .blk{fill:#ffc800;stroke:#b78d00;stroke-width:1.5}
.artbox .cst .gap{fill:none;stroke:#ffc800;stroke-width:3;stroke-linecap:round}
.artbox .turb{opacity:0}
.artbox .turb.on{opacity:1;animation:turbw .22s ease-in-out infinite}
@keyframes turbw{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
.artbox .vocal{opacity:.2}
.artbox .vocal.on{animation:vibw .16s ease-in-out infinite}
.artbox .vocal path{fill:none;stroke:#58cc02;stroke-width:3;stroke-linecap:round}
@keyframes vibw{0%,100%{opacity:.25}50%{opacity:1}}
.artbox .jaw,.artbox .tongue,.artbox .lips,.artbox .velum,.artbox .cst{
  transition:transform .42s cubic-bezier(.4,0,.2,1)}
.artbox .jaw{transform-box:view-box;transform-origin:180px 118px}
.artbox .tongue{transform-box:view-box;transform-origin:150px 150px}
.artbox .lips{transform-box:view-box;transform-origin:44px 104px}
.artbox .velum{transform-box:view-box;transform-origin:156px 94px}
.artbox .cst{transform-box:view-box;transform-origin:150px 118px}
.artbox .lbl{fill:var(--muted);font-size:11px;font-weight:700}
.dark .artbox .lbl{fill:#8aa1a8}
.artsteps{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.artsteps .st{font-size:12px;font-weight:800;color:var(--muted);border:2px solid var(--line);
  border-radius:999px;padding:4px 10px}
.artsteps .st.on{border-color:var(--blue);color:var(--blue);background:rgba(28,176,246,.10)}
.artinfo{margin-top:10px}
.artinfo .kv{border-bottom:1px solid var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mt{margin-top:14px} .mb{margin-bottom:14px}
/* 真人示范视频 */
.vcard{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.vcard .vt{font-weight:800;font-size:15px;line-height:1.4}
.vcard .vmeta{font-size:12px;color:var(--muted);margin:4px 0 8px}
.vcard .vd{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.playbtn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border:none;
  border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;text-decoration:none;font-family:inherit}
.playbtn:active{transform:translateY(2px)}
.vhint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}
.vframe{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-top:10px}
.vframe iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.vframe .ph{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;opacity:.75}
.vact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vact .btn{width:auto;flex:1;min-width:120px;padding:10px 12px;font-size:14px}
.wbox{position:relative;width:100%;max-width:300px;margin:10px auto 0;aspect-ratio:1/1}
.wbox canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;display:block}
.wbox .base{background:var(--card);border:2px solid var(--line);border-radius:18px}
.wbox .ink{background:transparent}
.wguide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;font-size:150px;font-weight:700;color:var(--text);opacity:.16;line-height:1}
.qbox{position:relative;width:100%;max-width:260px;margin:6px auto 0;aspect-ratio:1/1}
.qbox canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none;display:block}
.qbox .base{background:var(--soft);border:2px dashed var(--line);border-radius:18px}
.qbox .ink{background:transparent}
.fillbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px auto 0;max-width:260px}
.fillbar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.fillbar i.enough{background:var(--green)}
.wstat{display:flex;gap:10px;justify-content:center;margin-top:10px;font-size:14px;font-weight:800}
.wstat span{color:var(--muted)}
.wstat b{color:var(--blue)}
.dotgrid{position:absolute;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(circle,var(--line) 1.5px,transparent 1.5px);
  background-size:34px 34px}
.mgal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.mcell{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow-hidden;
  overflow:hidden;text-align:center;padding:6px}
.mcell img{width:100%;display:block;border-radius:10px;aspect-ratio:1/1;object-fit:cover}
.mcell .mk{font-weight:800;font-size:16px;margin-top:4px}
.mcell .md{font-size:11px;color:var(--muted);line-height:1.35;margin-top:2px}
.mbig{width:100%;max-width:260px;border-radius:14px;display:block;margin:0 auto;border:2px solid var(--line)}
.urlbox{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:13px;
  font-family:ui-monospace,Menlo,monospace;background:var(--soft);color:var(--text);margin-top:8px;word-break:break-all}
/* 学习卡片 */
.fcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:26px 18px;
  min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;cursor:pointer;box-shadow:var(--shadow);margin-top:10px}
.fcard:active{transform:translateY(2px)}
.fcard .big2{font-size:40px;font-weight:800;line-height:1.25;word-break:break-word}
.fcard .ro2{font-size:20px;color:var(--blue);font-weight:800;margin-top:6px}
.fcard .dz2{font-size:15px;color:var(--muted);margin-top:10px;line-height:1.5}
.fcard .ex2{font-size:15px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.5;word-break:break-word}
.fcard .ex2 b{font-size:17px}
.fcard .sub{font-size:13px;color:var(--muted);margin-top:8px}
.fcard .tag{position:absolute;top:10px;right:12px;font-size:11px;font-weight:800;color:var(--muted)}
.fcard{position:relative}
.speakrow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;
  font-weight:800;font-size:14px;cursor:pointer;color:var(--text);font-family:inherit}
.pill:active{transform:translateY(2px)}
.pill.on{border-color:var(--blue);color:var(--blue)}
.marks{display:flex;gap:6px;justify-content:center;margin-top:12px}
.marks i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;font-style:normal}
.marks i.k{background:var(--green)} .marks i.u{background:var(--orange)}
</style>
</head>
<body>
<div id="shell">
  <div id="app"></div>
  <div id="foot"></div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

const DEF = {ui:'zh', learn:null, level:'beginner', xp:0, todayXp:0, day:'', streak:0,
  goal:50, rate:0.8, rateV:2, autoSlow:true, brate:0.35, brepeat:1,
  dark:false, progress:{}, bprogress:{},
  correct:0, wrong:0, tab:'learn'};
let S = load();
function load(){
  let r = null;
  try{ r = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const st = Object.assign({}, DEF, r || {});
  // 旧版本默认语速 1.0 偏快，升级后统一到更自然的 0.8
  if(!r || r.rateV == null){ st.rate = 0.8; st.rateV = 2; }
  if(st.rate == null) st.rate = 0.8;
  if(st.brate == null) st.brate = 0.35;
  st.brepeat = 1;
  // 旧版本的基础语速偏快（0.55/0.7），升级后统一到更慢的档位
  if(st.brate > 0.5) st.brate = 0.35;
  return st;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function T(k){ const d = DATA.ui[S.ui] || DATA.ui.en; return d[k] != null ? d[k] : (DATA.ui.en[k]||''); }
function cname(l){ const m = DATA.courseNames[l] || {}; return m[S.ui] || m.en || l; }
function today(){ const d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function yesterday(){ const d = new Date(Date.now()-86400000); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let VPLAY = -1;
function openUrl(u){
  const copy = ()=>{ try{ navigator.clipboard && navigator.clipboard.writeText(u); }catch(e){ try{ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }catch(e2){} } };
  // 1) 正常开新窗口
  let win = null;
  try{ win = window.open(u, '_blank', 'noopener'); }catch(e){}
  if(win) { try{ win.opener = null; }catch(e){} return; }
  // 2) 用 a 元素点击（部分 webview 只认这个）
  try{ const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener';
       document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(), 800); return; }catch(e){}
  // 3) 直接改地址（可能离开本应用，最后手段）
  copy(); toast(T('open_failed'));
  setTimeout(()=>{ try{ location.href = u; }catch(e){} }, 900);
}
function copyUrl(u){
  let ok = false;
  try{ const t = document.createElement('textarea'); t.value = u; t.style.position='fixed'; t.style.opacity='0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, u.length);
    ok = document.execCommand('copy'); t.remove(); }catch(e){}
  if(!ok){ try{ navigator.clipboard.writeText(u); ok = true; }catch(e){} }
  toast(ok ? T('copied') : u);
}
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg; document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2200);
}

/* ---------- 语音 ---------- */
let VOICES = [];
function loadVoices(){ try{ VOICES = window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ VOICES=[]; } }
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(lang){
  if(!VOICES.length) return null;
  const want = (lang||'').toLowerCase();
  return VOICES.find(v=>v.lang && v.lang.toLowerCase().replace('_','-') === want)
    || VOICES.find(v=>v.lang && v.lang.toLowerCase().slice(0,2) === want.slice(0,2)) || null;
}
function inBasic(){
  if(L && (L.mode === 'basic' || L.skind === 'basic')) return true;
  return view === 'basics' || view === 'chart' || view === 'artic' || view === 'study' && L && L.skind === 'basic';
}
function baseRate(){
  return inBasic() ? (S.brate || 0.35) : (S.rate || 0.8);
}
/* 单个假名/字母本身极短，很多语音引擎对过短文本不怎么吃 rate，
   所以基础课程额外用「重复朗读 + 停顿」把听感拉长。 */
function stretchText(text){
  const n = S.brepeat == null ? 1 : Number(S.brepeat);
  const t = String(text);
  if(!inBasic() || n <= 1 || t.length > 8) return t;
  return Array(n).fill(t).join(' , ');
}
function speak(text, lang, rate){
  if(!window.speechSynthesis){ toast(T('no_voice')); return; }
  try{
    speechSynthesis.cancel();
    const body = stretchText(text);
    const u = new SpeechSynthesisUtterance(body);
    u.lang = DATA.tts[lang] || lang;
    let sp = rate || baseRate();
    // 长句自动放慢，更接近自然朗读
    if(S.autoSlow !== false && !rate && String(text).length > 12)
      sp = Math.max(0.3, sp - 0.12);
    u.rate = Math.round(Math.max(0.2, Math.min(1.2, sp)) * 100) / 100;
    const v = pickVoice(u.lang); if(v) u.voice = v;
    setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){} }, 80);  // iOS 需要 cancel 后短暂延迟
  }catch(e){ toast(T('no_voice')); }
}
document.addEventListener('click', function once(){
  if(window.speechSynthesis){ try{ speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){} loadVoices(); }
  document.removeEventListener('click', once);
}, {once:true});

/* ---------- 进度 ---------- */
function progOf(lang, level){
  const p = (S.progress[lang] && S.progress[lang][level]) || [false,false,false];
  return p.length===3 ? p : [false,false,false];
}
function setDone(lang, level, uid){
  if(!S.progress[lang]) S.progress[lang] = {};
  const p = progOf(lang, level).slice(); p[uid] = true;
  S.progress[lang][level] = p; save();
}
function doneCount(lang, level){ return progOf(lang, level).filter(Boolean).length; }
function bprogOf(lang){
  const n = (DATA.basics[lang]||[]).length;
  const p = S.bprogress[lang] || [];
  return Array.from({length:n}, (_,i)=>!!p[i]);
}
function setBasicDone(lang, idx){
  const n = (DATA.basics[lang]||[]).length;
  const p = (S.bprogress[lang]||[]).slice();
  while(p.length < n) p.push(false);
  p[idx] = true; S.bprogress[lang] = p; save();
}
function bdoneCount(lang){ return bprogOf(lang).filter(Boolean).length; }
function totalBDone(){ return DATA.langs.reduce((a,l)=>a+bdoneCount(l),0); }
function totalDone(){
  let n=0; for(const l of DATA.langs) for(const lv of DATA.levels) n += doneCount(l,lv); return n;
}
function totalBasicUnits(){ return DATA.langs.reduce((a,l)=>a+(DATA.basics[l]||[]).length,0); }
function touchDay(){
  const t = today();
  if(S.day !== t){
    if(S.day === yesterday()) S.streak = (S.streak||0) + 1;
    else if(S.day !== '') S.streak = 1;
    else S.streak = 1;
    S.day = t; S.todayXp = 0; save();
  }
}

/* ---------- 视图 ---------- */
let view = 'home';
let ctx = {lang:null, level:'beginner', unit:0};
let L = null;   // 当前课程运行时
function go(v, c){ view = v; if(c) Object.assign(ctx, c); ensureCtx(); render(); if(window.scrollTo) window.scrollTo(0,0); }
function ensureCtx(){ if(!ctx.lang || !DATA.courses[ctx.lang]) ctx.lang = S.learn || DATA.langs[0]; if(!ctx.level) ctx.level = 'beginner'; }

/* ---------- 题目运行时 ---------- */
function startUnit(lang, level, uid){
  const unit = DATA.courses[lang][level][uid];
  L = {lang, level, uid, qs: unit.qs.map(q=>({...q})), i:0, hearts:5,
       chosen:null, checked:false, ok:false, typed:'', hint:false, right:0, done:false, mode:'unit'};
  go('lesson', {lang, level, unit:uid});
  setTimeout(()=>autoSpeak(), 350);
}
function startStudy(lang, level, uid, kind){
  const src = kind === 'basic' ? (DATA.basics[lang][uid].fcards || DATA.basics[lang][uid].cards)
                               : DATA.courses[lang][level][uid].cards;
  L = {lang, level, uid, bidx:uid, mode:'study', skind:kind, cards: src.map(c=>({...c})),
       i:0, flipped:false, marks:[], done:false};
  go('study', {lang, level});
  setTimeout(()=>{ if(!L.flipped) speak(L.cards[0].au || L.cards[0].c, lang); }, 400);
  // 基础课程：点一次只发一次声，不再补读
}
function flipCard(){
  L.flipped = !L.flipped; render();
  if(L.flipped){ const c = L.cards[L.i]; speak(c.sent ? c.c : (c.au||c.c), L.lang); }
}
function markCard(ok){
  L.marks[L.i] = ok ? 'k' : 'u';
  if(!L.flipped){ L.flipped = true; render(); return; }
  L.i++; L.flipped = false;
  if(L.i >= L.cards.length){
    const k = L.marks.filter(m=>m==='k').length;
    S.xp += k * 2; touchDay(); save();
    L.done = true; go('studydone');
    return;
  }
  render(); window.scrollTo ? window.scrollTo(0,0) : null;
  setTimeout(()=>{ if(!L.flipped) speak(L.cards[L.i].au || L.cards[L.i].c, L.lang); }, 350);
}
function startBasicUnit(lang, idx){
  const unit = DATA.basics[lang][idx];
  L = {lang, level:S.level, uid:idx, bidx:idx, qs: unit.qs.map(q=>({...q})), i:0, hearts:5,
       chosen:null, checked:false, ok:false, typed:'', hint:false, right:0, done:false, mode:'basic'};
  go('lesson', {lang});
  setTimeout(()=>autoSpeak(), 350);
}
function autoSpeak(){
  if(!L || !L.qs) return;
  const q = L.qs[L.i]; if(!q) return;
  if(['listen','dictation','sent_listen','sent_dictation'].includes(q.t)) speak(q.audio, L.lang);
}
function norm(s){
  return String(s).toLowerCase().replace(/[\s\u3000]/g,'')
    .replace(/[.,!?;:'"«»„“”‘’¿¡。，、！？：；「」『』（）()\[\]{}<>・\-—~…·]/g,'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
function checkAnswer(){
  const q = L.qs[L.i];
  if(q.t === 'btrace'){
    const g = traceMeasure();
    if(!g || (!TR.strokes && TR.cov < 0.02)){ toast(T('trace_ready')); return; }
    TR.locked = true;
    L.ok = g.ok; L.traceCov = Math.round(g.cov*100); L.traceStray = Math.round(g.stray*100);
    L.checked = true;
    if(L.ok){ L.right++; S.xp += 10; S.todayXp += 10; S.correct++; }
    else { L.hearts--; S.wrong++; }
    touchDay(); save(); render(); return;
  }
  // 字母类题目（如 å / ä / ö）必须精确匹配，避免不同字符被判为同一个
  const strict = (q.t && q.t.charAt(0) === 'b' && q.t !== 'bdictation') || q.t === 'stroke';
  const same = (a, b) => strict ? String(a).trim() === String(b).trim() : norm(a) === norm(b);
  if(q.opts && q.opts.length){
    if(L.chosen === null) return;
    L.ok = same(L.chosen, q.ans);
  } else {
    if(!L.typed.trim()) return;
    L.ok = norm(L.typed) === norm(q.ans);
  }
  L.checked = true;
  if(L.ok){ L.right++; S.xp += 10; S.todayXp += 10; S.correct++; }
  else { L.hearts--; S.wrong++; }
  touchDay(); save(); render();
}
function nextQ(){
  if(!L.checked) return;
  if(L.hearts <= 0){ go('fail'); return; }
  L.i++; L.chosen = null; L.checked = false; L.typed = ''; L.hint = false;
  L.traceCov = 0; L.traceStray = 0; TR = null;
  if(L.i >= L.qs.length){ finishUnit(); return; }
  render(); if(window.scrollTo) window.scrollTo(0,0); setTimeout(()=>autoSpeak(), 300);
}
function finishUnit(){
  S.xp += 30; S.todayXp += 30;
  if(L.mode === 'basic') setBasicDone(L.lang, L.bidx);
  else if(L.mode !== 'practice') setDone(L.lang, L.level, L.uid);
  touchDay(); save();
  L.done = true; go('result');
}

/* ---------- 渲染 ---------- */
function render(){
  const app = document.getElementById('app');
  const foot = document.getElementById('foot');
  const showTabs = ['home','levels','units','basics','chart','stats','settings','videos','mouths','write'].includes(view);
  if(view !== 'artic') stopArtLoop();
  if(view === 'study' || view === 'studydone') foot.innerHTML = studyFootHTML();
  document.getElementById('tabbar').className = 'tabbar' + (showTabs ? '' : ' hidden');
  document.getElementById('tabbar').innerHTML = showTabs ? tabsHTML() : '';
  app.innerHTML = ({
    home: viewHome, levels: viewLevels, units: viewUnits, lesson: viewLesson,
    result: viewResult, fail: viewFail, basics: viewBasics, chart: viewChart,
    study: viewStudy, studydone: viewStudyDone, artic: viewArtic, videos: viewVideos,
    mouths: viewMouths, write: viewWrite,
    practice: viewPractice, stats: viewStats, settings: viewSettings, uilang: viewUiLang
  })[view]();
  foot.innerHTML = ((view==='lesson' || view==='practice') && L) ? footHTML() : '';
  if(view === 'lesson'){ const f = document.getElementById('typedInput'); if(f) f.focus(); }
  if(view === 'lesson' && L && L.qs[L.i] && L.qs[L.i].t === 'btrace' && !L.checked){
    setTimeout(()=>{ traceSetup('q', L.qs[L.i].w); }, 60);
  }
  if(view === 'lesson' && L && L.qs[L.i] && L.qs[L.i].t === 'btrace' && L.checked && TR){
    setTimeout(()=>{ traceSetup('q', L.qs[L.i].w); TR.locked = true; traceMeasure(); }, 60);
  }
}
function tabsHTML(){
  const items = [['learn','📚',T('nav_learn')],['basics','🔤',T('nav_basics')],
                 ['practice','🎯',T('nav_practice')],['stats','📊',T('nav_stats')],['settings','⚙️',T('nav_settings')]];
  return items.map(([k,ic,lb])=>`<button class="tab ${S.tab===k?'on':''}" data-act="tab" data-v="${k}">
    <span class="ic">${ic}</span><span>${esc(lb)}</span></button>`).join('');
}
function topbar(title, back){
  return `<div class="topbar">${back?`<button class="iconbtn backbtn" data-act="back">‹</button>`:`<span style="width:38px"></span>`}
    <div class="title">${esc(title)}</div>
    <button class="iconbtn" data-act="uilang">🌐</button></div>`;
}

      <div class="ring" style="--p:${pct}%"><i>🔥</i></div>
      <div class="grow" style="flex:1">
        <div class="h2">${esc(T('daily_goal'))}</div>
        <div class="muted">${S.todayXp||0} / ${S.goal||50} ${esc(T('xp'))}</div>
        <div class="bar gold mt" style="margin-top:6px"><i style="width:${pct}%"></i></div>
      </div>
      <div style="text-align:center">
        <div class="big" style="color:var(--orange)">${S.streak||0}</div>
        <div class="muted">${esc(T('streak_days'))}</div>
      </div>
    </div>`;
  if(cur){
    const d = doneCount(cur, S.level);
    html += `<div class="card">
      <div class="row">
        <span style="font-size:30px">${DATA.flags[cur]}</span>
        <div class="grow" style="flex:1">

    </div>`;
  } else {
    html += `<div class="center muted mb">${esc(T('pick_lang_first'))}</div>`;
  }
  html += `<div class="h1">${esc(T('choose_course'))}</div>`;
  html += DATA.langs.map(l=>{
    const tot = DATA.levels.reduce((a,lv)=>a+doneCount(l,lv),0);
    return `<div class="item" data-act="picklang" data-v="${l}">
      <span class="flag">${DATA.flags[l]}</span>

      <div class="muted">${esc(T('video_desc'))}</div></div>
      <span class="badge" style="color:var(--gold);border-color:var(--gold)">${(DATA.videos[ctx.lang]||[]).length}</span>

  html += `<div class="item" style="border-color:var(--blue)" data-act="basics">

function viewUnits(){

  const units = DATA.courses[ctx.lang][ctx.level];
  let html = topbar(T(ctx.level), true);
  html += `<div class="h1">${esc(cname(ctx.lang))} · ${esc(T(ctx.level))}</div>
    <div class="muted mb">${esc(T('lv_'+ctx.level+'_d'))}</div>
    <div class="card" style="background:rgba(28,176,246,.08);border-color:var(--blue)">
      <div class="row"><span style="font-size:22px">📖</span>
      <div class="grow" style="flex:1"><div style="font-weight:800">${esc(T('study_title'))}</div>
      <div class="muted">${esc(T('study_desc'))}</div></div></div></div>`;
  html += units.map((u,i)=>{
    const done = progOf(ctx.lang, ctx.level)[i];
    const nq = u.qs.length;
    const kinds = [...new Set(u.qs.map(q=>q.t))].map(k=>({choice:'🔤',reverse:'🔁',listen:'🔊',dictation:'✍️',sent_choice:'📝',sent_dictation:'✍️',sent_listen:'🎧'}[k])).join(' ');
    const title = S.ui==='zh' ? u.title.zh : u.title.en;
    return `<div class="item ${done?'done':''}" data-act="startstudy" data-v="${i}">
      <span class="flag" style="font-size:22px">${done?'✅':'📖'}</span>
      <div class="grow">
        <div class="nm">${esc(T('unit'))} ${i+1} · ${esc(title)}</div>
        <div class="muted">${u.cards.length} 📖 ${esc(T('study'))} · ${nq} ✏️ ${esc(T('quiz'))} ${kinds}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn sm blue" data-act="startstudy" data-v="${i}">📖</button>
        <button class="btn sm" data-act="openartic2" data-v="${i}:0">👄</button>
        <button class="btn sm" data-act="openwrite" data-v="${i}:0">✍️</button>
        <button class="btn sm primary" data-act="startbasic" data-v="${i}">✏️</button>
      </div>
    </div>`;
  }).join('');
  if(doneCount(ctx.lang, ctx.level)===3)
    html += `<div class="center muted mt">🏅 ${esc(T('all_done'))}</div>`;
  return html;
}

/* ---------- 发音动画引擎 ---------- */
const MOUTH = {open:{jaw:11,lip:1.5}, mid:{jaw:6,lip:1.2}, narrow:{jaw:2.5,lip:1.0}, closed:{jaw:0,lip:0.7}};
const TY = {high:-19, mid:-8, low:2};
const TX = {front:-17, central:0, back:15};
const LP = {rounded:[0.72,1.28], spread:[1.3,0.8], neutral:[1,1]};
const PLACE_PT = {
  bilabial:[54,104], labiodental:[60,106], alveolar:[94,98], postalveolar:[110,94],
  palatal:[132,90], velar:[164,96], glottal:[182,150]
};
const PLACE_TG = {
  bilabial:[0,2], labiodental:[0,0], alveolar:[-8,-15], postalveolar:[-2,-16],
  palatal:[6,-19], velar:[16,-16], glottal:[6,-3]
};
const VOW = {
  a:{mouth:'open',tongue:'low',tpos:'central',lips:'neutral'},
  i:{mouth:'narrow',tongue:'high',tpos:'front',lips:'spread'},
  u:{mouth:'narrow',tongue:'high',tpos:'back',lips:'rounded'},
  e:{mouth:'mid',tongue:'mid',tpos:'front',lips:'spread'},
  o:{mouth:'mid',tongue:'mid',tpos:'back',lips:'rounded'},
  eo:{mouth:'mid',tongue:'mid',tpos:'back',lips:'neutral'},
  eu:{mouth:'narrow',tongue:'high',tpos:'back',lips:'spread'},
  ae:{mouth:'mid',tongue:'low',tpos:'front',lips:'spread'},
  oe:{mouth:'mid',tongue:'mid',tpos:'front',lips:'rounded'},
  wi:{mouth:'narrow',tongue:'high',tpos:'front',lips:'rounded'},
  y:{mouth:'narrow',tongue:'high',tpos:'central',lips:'spread'},
  schwa:{mouth:'mid',tongue:'mid',tpos:'central',lips:'neutral'}
};
const VOW_TXT = {a:'a',i:'i',u:'u',e:'e',o:'o',eo:'eo',eu:'eu',ae:'ae',oe:'oe',wi:'wi',y:'y',schwa:'ə'};

let ART = null, ART_TMR = null, ART_IDX = 0, ART_STEPS = [], ART_PLAY = true;
function artStepsOf(a){
  const st = [];
  if(a.c) st.push('cons');
  st.push('v1');
  if(a.v2) st.push('v2');
  return st;
}
function setArtPhase(phase){
  const a = ART; if(!a) return;
  const g = id => document.getElementById(id);
  const jaw = g('jaw'), tg = g('tongue'), lp = g('lips'), vl = g('velum'), cst = g('cst');
  if(!jaw) return;
  let jd = 0, lipS = [1,1], tdx = 0, tdy = 0, tsc = [1,1];
  let airO = false, airN = false, vocal = false, cstOn = false, cstMode = '', cstPt = [150,118];
  const v = VOW[a.v] || VOW.a;
  if(phase === 'cons' && a.c){
    const p = a.c.place, m = a.c.manner;
    const pt = PLACE_PT[p] || PLACE_PT.alveolar;
    const tgo = PLACE_TG[p] || [0,0];
    cstPt = pt; cstOn = true;
    tdx = tgo[0]; tdy = tgo[1]; tsc = [1.02, 1.05];
    if(m === 'stop' || m === 'affricate'){
      jd = 0; lipS = (p === 'bilabial' || p === 'labiodental') ? [1.15,0.62] : [0.95,0.85];
      cstMode = 'blk';
    } else if(m === 'nasal'){
      jd = 0; lipS = (p === 'bilabial') ? [1.15,0.62] : [0.95,0.85];
      cstMode = 'blk'; airN = true;
      vl.style.transform = 'rotate(22deg) translateY(4px)';
    } else if(m === 'fricative'){
      jd = 2; lipS = [1.05,0.95]; cstMode = 'gap';
    } else {
      jd = 3; lipS = [1,1]; cstMode = 'gap';
    }
    vocal = !!a.c.voiced;
    if(m === 'stop' || m === 'affricate') vocal = !!a.c.voiced;
  } else {
    const vv = VOW[(phase === 'v2' && a.v2) ? a.v2 : a.v] || VOW.a;
    const mo = MOUTH[vv.mouth] || MOUTH.mid;
    jd = mo.jaw; lipS = LP[vv.lips] || LP.neutral;
    lipS = [lipS[0], lipS[1] * (0.85 + mo.lip * 0.25)];
    tdx = TX[vv.tpos]; tdy = TY[vv.tongue];
    tsc = [vv.tongue === 'high' ? 0.95 : 1.02, vv.tongue === 'high' ? 1.18 : 1];
    airO = true; vocal = true;
    vl.style.transform = 'rotate(0deg)';
  }
  jaw.style.transform = 'rotate(' + jd + 'deg)';
  tg.style.transform = 'translate(' + tdx + 'px,' + tdy + 'px) scale(' + tsc[0] + ',' + tsc[1] + ')';
  lp.style.transform = 'scale(' + lipS[0].toFixed(2) + ',' + lipS[1].toFixed(2) + ')';
  cst.style.transform = 'translate(' + (cstPt[0] - 150) + 'px,' + (cstPt[1] - 118) + 'px)';
  cst.classList.toggle('on', cstOn);
  g('cstBlk').style.display = (cstMode === 'blk') ? '' : 'none';
  g('cstGap').style.display = (cstMode === 'gap') ? '' : 'none';
  g('cstTurb').classList.toggle('on', cstOn && cstMode === 'gap');
  g('airO').classList.toggle('on', airO);
  g('airN').classList.toggle('on', airN);
  g('vocal').classList.toggle('on', vocal);
  const sts = document.querySelectorAll('.artsteps .st');
  sts.forEach((el,i)=>el.classList.toggle('on', ART_STEPS[i] === phase));
}
function artTick(){
  if(!ART) return;
  ART_IDX = (ART_IDX + 1) % ART_STEPS.length;
  setArtPhase(ART_STEPS[ART_IDX]);
}
function startArtLoop(){
  stopArtLoop();
  if(!ART) return;
  ART_STEPS = artStepsOf(ART);
  ART_IDX = 0; setArtPhase(ART_STEPS[0]);
  if(ART_PLAY) ART_TMR = setInterval(artTick, ART.c ? 1150 : 1350);
}
function stopArtLoop(){ if(ART_TMR){ clearInterval(ART_TMR); ART_TMR = null; } }
function articText(a){
  const bits = [];
  if(a.c){
    bits.push(T('place') + ': ' + T('p_' + a.c.place));
    bits.push(T('manner') + ': ' + T('m_' + a.c.manner));
    bits.push(T('voice') + ': ' + (a.c.voiced ? T('voiced') : T('voiceless')));
  }
  const v = VOW[a.v] || VOW.a;
  bits.push(VOW_TXT[a.v] + ': ' + T('v_' + v.mouth) + '・' + T('t_' + v.tongue) + '・' + T('tp_' + v.tpos) + '・' + T('l_' + v.lips));
  if(a.v2){ const v2 = VOW[a.v2] || VOW.a; bits.push('→ ' + VOW_TXT[a.v2]); }
  return bits;
}

function isZh(){ return S.ui === 'zh'; }
function descOf(q){
  if(q.dz != null) return isZh() ? q.dz : q.de;
  if(S.ui === 'zh') return q.zh || q.en;
  if(S.ui === 'en') return q.en || q.zh;
  return q.en || q.zh;   // 其他界面语言用英文释义
}
function ansTxtOf(q){
  if(q.t === 'choice') return isZh() ? q.zh : (q.en || q.zh);
  if(q.t === 'sent_choice' || q.t === 'sent_listen' || q.t === 'sent_dictation') return q.w;
  if(q.t === 'bdictation') return q.ans;
  return q.ans || q.w;
}
function detailHTML(q){
  const bits = [];
  const a = ansTxtOf(q);
  bits.push('<b>' + esc(a) + '</b>');
  if(q.t === 'choice'){
    if(isZh()) bits.push(esc(q.w));
    else { if(q.zh) bits.push(esc(q.zh)); }
  } else if(q.t === 'sent_choice' || q.t === 'sent_listen' || q.t === 'sent_dictation'){
    const m = descOf(q); if(m) bits.push(esc(m));
  } else if(q.t === 'btrace'){
    bits.push(esc(L.traceCov || 0) + '%');
    if(L.ok){ bits.push(esc(T('trace_ok'))); }
    else if((L.traceStray||0) > 85){ bits.push(esc(T('trace_mess'))); }
    else { bits.push(esc(T('trace_more'))); }
    if(q.so) bits.push(esc(T('write_order')) + ': ' + esc(q.so));
  } else if(q.t && q.t.charAt(0) === 'b'){
    const d = descOf(q); if(d) bits.push(esc(d));
    if(q.ex) bits.push(esc(T('example_word')) + ': ' + esc(q.ex.w) + '（' + esc(isZh() ? q.ex.zh : q.ex.en) + '）');
  } else {
    const m = descOf(q); if(m) bits.push(esc(m));
  }
  return bits.join(' · ');
}

function optsHTML(q){

/* ---------- 描黑默写（手指描字，按覆盖度判定） ---------- */
const TR_FONT = "'Hiragino Sans','Yu Gothic','Noto Sans JP','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Segoe UI',sans-serif";
let TR = null;   // {idp, ch, size, mask, strokes, cov, stray, dirty}
function traceBoxHTML(ch, idp, cls){
  return `<div class="${cls}">
      <div class="dotgrid"></div>
      <canvas class="base" id="${idp}guide"></canvas>
      <canvas class="ink" id="${idp}ink"></canvas>
    </div>
    <div class="fillbar"><i id="${idp}bar" style="width:0%"></i></div>
    <div class="wstat"><span>${esc(T('fill_rate'))} <b id="${idp}cov">0%</b></span></div>`;
}
function traceSetup(idp, ch){
  const gc = document.getElementById(idp+'guide');
  const ic = document.getElementById(idp+'ink');
  if(!gc || !ic || !gc.getContext) return;
  const box = gc.parentNode;
  const bw = (box && box.clientWidth) || 280;
  const size = Math.max(200, Math.min(340, bw));
  gc.width = gc.height = ic.width = ic.height = size;
  const g = gc.getContext('2d');
  const font = Math.round(size*0.68) + 'px ' + TR_FONT;
  g.clearRect(0,0,size,size);
  g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.globalAlpha = 0.20;
  g.fillStyle = getComputedStyle(document.body).getPropertyValue('--text').trim() || '#333';
  g.fillText(ch, size/2, size/2 + size*0.02);
  g.globalAlpha = 1;
  // 字形掩膜（判定用）
  let mask = null;
  try{
    const mc = document.createElement('canvas'); mc.width = mc.height = size;
    const m = mc.getContext('2d');
    m.font = font; m.textAlign = 'center'; m.textBaseline = 'middle'; m.fillStyle = '#000';
    m.fillText(ch, size/2, size/2 + size*0.02);
    mask = m.getImageData(0,0,size,size).data;
  }catch(e){}
  const k = ic.getContext('2d');
  k.clearRect(0,0,size,size);
  k.lineWidth = Math.max(6, Math.round(size/30));
  k.lineCap = 'round'; k.lineJoin = 'round';
  k.strokeStyle = getComputedStyle(document.body).getPropertyValue('--blue').trim() || '#1cb0f6';
  TR = {idp:idp, ch:ch, size:size, mask:mask, strokes:0, cov:0, stray:0};
  const pos = e => { const r = ic.getBoundingClientRect();
    const t = (e.touches && e.touches[0]) || e; return [t.clientX-r.left, t.clientY-r.top]; };
  let cur = null;
  const down = e => { e.preventDefault(); if(!TR || TR.locked) return;
    cur = pos(e); k.beginPath(); k.moveTo(cur[0], cur[1]); TR.strokes++; };
  const move = e => { if(!cur) return; e.preventDefault(); const p = pos(e);
    k.lineTo(p[0],p[1]); k.stroke(); k.beginPath(); k.moveTo(p[0],p[1]); };
  const up = () => { if(!cur) return; cur = null; k.beginPath(); traceMeasure(); };
  ic.addEventListener('touchstart', down, {passive:false});
  ic.addEventListener('touchmove', move, {passive:false});
  ic.addEventListener('touchend', up);
  ic.addEventListener('mousedown', down);
  ic.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}
function traceMeasure(){
  if(!TR || !TR.mask) return null;
  const ic = document.getElementById(TR.idp+'ink'); if(!ic || !ic.getContext) return null;
  let d = null;
  try{ d = ic.getContext('2d').getImageData(0,0,TR.size,TR.size).data; }catch(e){ return null; }
  const mk = TR.mask;
  let tot=0, hit=0, out=0;
  for(let i=3;i<d.length;i+=4){
    if(mk[i] > 60){ tot++; if(d[i] > 40) hit++; }
    else if(d[i] > 40) out++;
  }
  if(!tot) return null;
  TR.cov = hit/tot; TR.stray = out/Math.max(1, hit+out);
  const pct = Math.round(TR.cov*100);
  const el = document.getElementById(TR.idp+'cov'); if(el) el.textContent = pct + '%';
  const bar = document.getElementById(TR.idp+'bar');
  if(bar){ bar.style.width = Math.min(100, pct) + '%';
    bar.className = (TR.cov >= 0.55 && TR.stray <= 0.85) ? 'enough' : ''; }
  return {cov:TR.cov, stray:TR.stray, ok:(TR.cov >= 0.55 && TR.stray <= 0.85)};
}
function traceReset(){
  if(!TR) return;
  const ic = document.getElementById(TR.idp+'ink');
  if(ic && ic.getContext){ try{ ic.getContext('2d').clearRect(0,0,TR.size,TR.size); }catch(e){} }
  TR.strokes = 0; TR.cov = 0; TR.stray = 0;
  const el = document.getElementById(TR.idp+'cov'); if(el) el.textContent = '0%';
  const bar = document.getElementById(TR.idp+'bar'); if(bar){ bar.style.width='0%'; bar.className=''; }
}

function viewHomePick(){
  return `<div class="grid2">${DATA.langs.map(l=>`<button class="chip" data-act="picklang" data-v="${l}">${DATA.flags[l]} ${esc(cname(l))}</button>`).join('')}</div>`;
}

function viewPractice(){
  if(!S.learn){
    let html = topbar(T('practice_title'), false);
    html += `<div class="center muted mb">${esc(T('pick_lang_first'))}</div>` + viewHomePick(); return html;
  }
  if(!L || L.mode !== 'practice'){
    const pool = [];
    for(const lv of DATA.levels){
      const done = progOf(S.learn, lv);
      DATA.courses[S.learn][lv].forEach((u,i)=>{ if(done[i]) pool.push(...u.qs); });
    }
    const src = pool.length ? pool : DATA.courses[S.learn][S.level].flatMap(u=>u.qs);
    const qs = [];
    const copy = src.slice();
    for(let i=0;i<10 && copy.length;i++) qs.push(copy.splice(Math.floor(Math.random()*copy.length),1)[0]);
    L = {lang:S.learn, level:S.level, uid:0, qs:qs.map(q=>({...q})), i:0, hearts:5,
         chosen:null, checked:false, ok:false, typed:'', hint:false, right:0, mode:'practice', done:false};
    setTimeout(()=>autoSpeak(), 350);
  }
  const q = L.qs[L.i];
  const pct = Math.round(L.i / L.qs.length * 100);
  let html = `<div class="topbar">
      <button class="iconbtn backbtn" data-act="quit">✕</button>
      <div class="bar blue" style="flex:1"><i style="width:${pct}%"></i></div>
      <div style="min-width:54px;text-align:right">${[0,1,2,3,4].map(i=>`<span class="heart ${i<L.hearts?'':'off'}">❤</span>`).join('')}</div>
    </div>`;
  html += `<div class="qwrap">${qPromptHTML(q)}${q.opts && q.opts.length ? optsHTML(q) : ''}</div>`;
  return html;
}

function viewStats(){
  const tot = S.correct + S.wrong;
  const acc = tot ? Math.round(S.correct / tot * 100) : 0;
  let html = topbar(T('stats_title'), false);
  html += `<div class="card">
      <div class="kv"><span>🔥 ${esc(T('streak_days'))}</span><span class="big" style="color:var(--orange)">${S.streak||0}</span></div>
      <div class="kv"><span>⭐ ${esc(T('total_xp'))}</span><span class="big" style="color:var(--gold)">${S.xp||0}</span></div>
      <div class="kv"><span>✅ ${esc(T('units_done'))}</span><span class="big" style="color:var(--green)">${totalDone()}</span></div>
      <div class="kv"><span>🔤 ${esc(T('basics_title'))}</span><span class="big" style="color:var(--blue)">${totalBDone()}/${totalBasicUnits()}</span></div>
      <div class="kv"><span>📖 ${esc(T('words_learned'))}</span><span class="big" style="color:var(--green)">${totalDone()*6}</span></div>
      <div class="kv"><span>🎯 ${esc(T('accuracy'))}</span><span class="big" style="color:var(--purple)">${acc}%</span></div>
    </div>
    <div class="h2">${esc(T('progress'))}</div>`;
  html += DATA.langs.map(l=>{
    const d = DATA.levels.reduce((a,lv)=>a+doneCount(l,lv),0);
    const pct = Math.round(d/9*100);
    return `<div class="item" style="cursor:default">
      <span class="flag">${DATA.flags[l]}</span>
      <div class="grow"><div class="nm">${esc(cname(l))}</div>
      <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
      <span class="badge">${d}/9</span></div>`;
  }).join('');
  return html;
}

function viewSettings(){
  let html = topbar(T('settings_title'), false);
  html += `<div class="card">
    <div class="h2">🌐 ${esc(T('ui_language'))}</div>
    <div class="grid2 mt">${DATA.uiLangs.map(l=>`<button class="chip ${S.ui===l?'on':''}" data-act="setui" data-v="${l}">${esc(DATA.uiNames[l])}</button>`).join('')}</div>
  </div>`;
  html += `<div class="card">
    <div class="h2">🔊 ${esc(T('speech_rate'))}</div>
    <div class="grid3 mt">
      <button class="chip ${S.rate===0.6?'on':''}" data-act="setrate" data-v="0.6">🐢 ${esc(T('vslow'))}<br><span class="muted">0.6×</span></button>
      <button class="chip ${S.rate===0.8?'on':''}" data-act="setrate" data-v="0.8">🚶 ${esc(T('slow'))}<br><span class="muted">0.8×</span></button>
      <button class="chip ${S.rate===1?'on':''}" data-act="setrate" data-v="1">▶️ ${esc(T('normal'))}<br><span class="muted">1.0×</span></button>
    </div>
    <div class="muted mt">${esc(T('rate_hint'))}</div>
    <div class="kv"><span>${esc(T('auto_slow'))}</span>
      <button class="chip ${S.autoSlow===false?'':'on'}" style="width:auto" data-act="toggleauto">${S.autoSlow===false?'OFF':'ON'}</button></div>
  </div>`;
  html += `<div class="card">
    <div class="h2">🔤 ${esc(T('basic_rate'))}</div>
    <div class="grid3 mt">
      <button class="chip ${S.brate===0.25?'on':''}" data-act="setbrate" data-v="0.25">🐢🐢 ${esc(T('vslow'))}<br><span class="muted">0.25×</span></button>
      <button class="chip ${S.brate===0.35?'on':''}" data-act="setbrate" data-v="0.35">🐢 ${esc(T('slower'))}<br><span class="muted">0.35×</span></button>
      <button class="chip ${S.brate===0.5?'on':''}" data-act="setbrate" data-v="0.5">🚶 ${esc(T('slow'))}<br><span class="muted">0.5×</span></button>
    </div>
    <div class="h2 mt">🔁 ${esc(T('brepeat'))}</div>
    <div class="grid3 mt">
      ${[1,2,3].map(n=>`<button class="chip ${(S.brepeat||1)===n?'on':''}" data-act="setbrepeat" data-v="${n}">${n}×</button>`).join('')}
    </div>
    <div class="muted mt">${esc(T('brepeat_hint'))}</div>
  </div>`;
  html += `<div class="card">
    <div class="h2">🎯 ${esc(T('daily_goal'))}</div>
    <div class="grid2 mt">${[10,20,50,100].map(g=>`<button class="chip ${S.goal===g?'on':''}" data-act="setgoal" data-v="${g}">${g} ${esc(T('xp'))}</button>`).join('')}</div>
  </div>`;
  html += `<div class="card">
    <div class="h2">🌙 ${esc(T('dark'))}</div>
    <div class="grid2 mt">
      <button class="chip ${!S.dark?'on':''}" data-act="setdark" data-v="0">☀️</button>
      <button class="chip ${S.dark?'on':''}" data-act="setdark" data-v="1">🌙</button>
    </div>
  </div>`;
  html += `<button class="btn danger mt" data-act="reset">🗑 ${esc(T('reset_progress'))}</button>
    <div class="center muted mt">${esc(T('rate_us'))}</div>`;
  return html;
}

function viewUiLang(){
  let html = topbar(T('ui_language'), true);
  html += `<div class="grid2">${DATA.uiLangs.map(l=>`<button class="chip ${S.ui===l?'on':''}" data-act="setui" data-v="${l}">${esc(DATA.uiNames[l])}</button>`).join('')}</div>`;
  return html;
}

/* ---------- 事件 ---------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.getAttribute('data-act'); const v = el.getAttribute('data-v');
  switch(act){
    case 'tab': S.tab = v; L = null; save();
      if(v==='learn') go('home'); else go(v); break;
    case 'uilang': go('uilang'); break;
    case 'back':
      if(view==='levels') go('home');
      else if(view==='units') go('levels');
      else if(view==='chart') go('basics');
      else if(view==='artic') go(L && L.skind==='basic' ? 'study' : 'basics');
      else go('home');
      break;
    case 'picklang': S.learn = v; S.tab='learn'; save(); go('levels', {lang:v}); break;
    case 'picklevel': S.level = v; save(); go('units', {level:v}); break;
    case 'continue': go('units', {lang:S.learn, level:S.level}); break;
    case 'startunit': startUnit(ctx.lang, ctx.level, Number(v)); break;
    case 'startstudy': startStudy(ctx.lang, ctx.level, Number(v),
                         (DATA.basics[S.learn] && view==='basics') ? 'basic' : 'unit'); break;
    case 'flip': if(view==='study') flipCard(); break;
    case 'studyspeak': speak(L.cards[L.i].au || L.cards[L.i].c, L.lang, Number(v) || undefined); break;
    case 'speakslower': speak(v, L ? L.lang : S.learn, 0.3); break;
    case 'mark': if(view==='study') markCard(v === '1'); break;
    case 'restudy': { const k = L.skind, lg = L.lang, lv = L.level, ui = L.uid; startStudy(lg, lv, ui, k); break; }
    case 'toquiz': if(L.skind === 'basic') startBasicUnit(L.lang, L.uid); else { const lg=L.lang, lv=L.level, ui=L.uid; startUnit(lg, lv, ui); } break;
    case 'quitstudy': { const k = L.skind; L = null; go(k === 'basic' ? 'basics' : 'units', {lang:ctx.lang, level:ctx.level}); break; }
    case 'basics': S.tab='basics'; save(); go('basics', {lang: ctx.lang || S.learn}); break;
    case 'chart': go('chart'); break;
    case 'videos': VPLAY = -1; go('videos', {lang: ctx.lang || S.learn}); break;
    case 'mouths': go('mouths', {lang: ctx.lang || S.learn}); break;
    case 'openwrite': { const p = String(v || '0:0').split(':');
      W = {lang: S.learn, unit: Number(p[0]), i: Number(p[1]), strokes: [], showOrder:false,
           from: (L && view === 'study') ? 'study' : null};
      go('write'); break; }
    case 'wclear': traceReset(); break;
    case 'worder': if(W){ W.showOrder = !W.showOrder; render(); } break;
    case 'wspeak': { const c = writeCard(); if(c) speak(c.au || c.c, W.lang); break; }
    case 'wnav': { const units = DATA.basics[W.lang] || []; const n = (units[W.unit]||{cards:[]}).cards.length;
      W.i = (W.i + Number(v) + n) % n; W.showOrder = false; TR = null; render(); break; }
    case 'wfinish': { let bonus = 2;
      const g = traceMeasure(); if(g && g.ok) bonus = 5;
      S.xp += bonus; touchDay(); save(); toast('✓ +' + bonus + ' XP');
      const wasStudy = W.from === 'study';
      W = null; go(wasStudy ? 'study' : 'basics'); break; }
    case 'vplay': { const v = (DATA.videos[S.learn]||[])[Number(v2)];
      if(!v) break;
      if(v.embed){ VPLAY = (VPLAY === Number(v2)) ? -1 : Number(v2); render(); }
      break; }
    case 'vcopy': { const v = (DATA.videos[S.learn]||[])[Number(v2)]; if(v) copyUrl(v.web); break; }
    case 'openartic': ctx.bunit = L.uid; ctx.bchar = L.i; go('artic'); break;
    case 'openartic2': { const p = String(v).split(':'); ctx.bunit = Number(p[0]); ctx.bchar = Number(p[1]); go('artic', {lang:S.learn}); break; }
    case 'artspeak': { const cs = (DATA.basics[S.learn][ctx.bunit||0].fcards); speak(cs[ctx.bchar||0].au || cs[ctx.bchar||0].c, S.learn); break; }
    case 'arttwice': { const cs = (DATA.basics[S.learn][ctx.bunit||0].fcards); const t = cs[ctx.bchar||0].au || cs[ctx.bchar||0].c;
      speak(t, S.learn); setTimeout(()=>speak(t, S.learn), 1600); break; }
    case 'arttoggle': ART_PLAY = !ART_PLAY; if(ART_PLAY) startArtLoop(); else stopArtLoop(); render(); break;
    case 'artnav': { const n = (DATA.basics[S.learn][ctx.bunit||0].fcards).length;
      ctx.bchar = ((ctx.bchar||0) + Number(v) + n) % n; go('artic'); break; }
    case 'startbasic': startBasicUnit(S.learn, Number(v)); break;
    case 'speak': speak(v, L ? L.lang : S.learn); break;
    case 'speakslow': speak(v, L ? L.lang : S.learn, 0.6); break;
    case 'speakau': speak(v, S.learn); break;
    case 'choose': if(L.checked) return; L.chosen = v; render(); break;
    case 'hint': L.hint = true; render(); break;
    case 'tclear': traceReset(); render(); break;
    case 'check': checkAnswer(); break;
    case 'next': nextQ(); break;
    case 'quit': L = null; go(L && L.mode==='basic' ? 'basics' : 'home'); break;
    case 'again': if(L.mode==='practice'){ L = null; go('practice'); }
      else if(L.mode==='basic') startBasicUnit(L.lang, L.bidx);
      else startUnit(L.lang, L.level, L.uid); break;
    case 'backtounits': if(L.mode==='practice'){ L = null; go('home'); }
      else if(L.mode==='basic'){ L = null; go('basics', {lang:L.lang}); }
      else { L = null; go('units', {lang:L.lang, level:L.level}); } break;
    case 'setui': S.ui = v; document.documentElement.lang = v; save();
      go(view==='uilang'?'settings':view); break;
    case 'setrate': S.rate = Number(v); save(); render();
      setTimeout(()=>speak(cname(S.learn), S.learn), 60); break;
    case 'toggleauto': S.autoSlow = (S.autoSlow === false); save(); render(); break;
    case 'setbrepeat': S.brepeat = Number(v); save(); render();
    case 'setbrate': S.brate = Number(v); save(); render();
      setTimeout(()=>speak((DATA.basics[S.learn] || DATA.basics[DATA.langs[0]])[0].fcards[0].au ||
        (DATA.basics[S.learn] || DATA.basics[DATA.langs[0]])[0].fcards[0].c, S.learn), 60); break;
    case 'setgoal': S.goal = Number(v); save(); render(); break;
    case 'setdark': S.dark = v === '1'; applyDark(); save(); render(); break;
    case 'reset': if(confirm(T('confirm_reset'))){ S = Object.assign({}, DEF, {ui:S.ui, rate:S.rate, rateV:S.rateV, autoSlow:S.autoSlow, brate:S.brate, brepeat:S.brepeat, goal:S.goal, dark:S.dark}); save(); toast('✔'); go('home'); } break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id === 'typedInput' && L){ L.typed = e.target.value; const f = document.getElementById('foot'); if(f && !L.checked){ /* 刷新按钮态 */ const b = f.querySelector('[data-act=check]'); if(b) b.className = 'btn primary' + (L.typed.trim()?'':' disabled'); } }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Enter' && view === 'lesson' && L){
    if(!L.checked) checkAnswer(); else nextQ();
  }
  if(view === 'lesson' && L && !L.checked && L.qs[L.i] && L.qs[L.i].opts && L.qs[L.i].opts.length){
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= L.qs[L.i].opts.length){ L.chosen = L.qs[L.i].opts[n-1]; render(); }
  }
});
function applyDark(){ document.body.classList.toggle('dark', !!S.dark); }
applyDark();
ensureCtx();
document.documentElement.lang = S.ui;
touchDay();
render();
</script>
